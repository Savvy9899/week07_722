name: CI Pipeline

on:
  # Allow the workflow to be started manually
  workflow_dispatch:

  # Automatically run CI when changes are pushed to main
  push:
    branches:
      - main


jobs:

  # =========================================================
  # Backend Tests
  # =========================================================
  backend-test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        include:
          - service: user-service
            database: users
            port: 5433

          - service: student-service
            database: students
            port: 5434

          - service: lecturer-service
            database: lecturers
            port: 5435

          - service: course-service
            database: courses
            port: 5436

          - service: enrollment-service
            database: enrollments
            port: 5437

    # PostgreSQL container used during backend testing
    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ${{ matrix.database }}

        ports:
          - ${{ matrix.port }}:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d ${{ matrix.database }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ${{ matrix.database }}
      POSTGRES_HOST: localhost
      POSTGRES_PORT: ${{ matrix.port }}

      JWT_SECRET_KEY: koalatech-ci-test-secret
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30

      DEFAULT_ADMIN_USERNAME: admin
      DEFAULT_ADMIN_EMAIL: admin@koalatech.edu.au
      DEFAULT_ADMIN_PASSWORD: AdminPassword123!

      AZURE_STORAGE_CONNECTION_STRING: ""
      AZURE_STORAGE_CONTAINER_NAME: ""

    steps:

      # Node.js 24 compatible version
      - name: Checkout repository
        uses: actions/checkout@v5

      # Node.js 24 compatible version
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: ${{ matrix.service }}
        run: |
          pytest -v
  # =========================================================
  # Frontend Tests
  # =========================================================
  frontend-test:
    name: Test frontend
    runs-on: ubuntu-latest

    env:
      VITE_USER_SERVICE_URL: http://localhost:8001
      VITE_STUDENT_SERVICE_URL: http://localhost:8002
      VITE_LECTURER_SERVICE_URL: http://localhost:8003
      VITE_COURSE_SERVICE_URL: http://localhost:8004
      VITE_ENROLLMENT_SERVICE_URL: http://localhost:8005

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --run


  # =========================================================
  # Build and Push Docker Images
  # =========================================================
  build-and-push:
    name: Build and Push ${{ matrix.image }}
    runs-on: ubuntu-latest

    # IMPORTANT:
    # Docker images are built and pushed only when ALL
    # backend tests have completed successfully.
    needs:
      - backend-test
      - frontend-test

    # Run for either a push to main or a manual workflow run
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    strategy:
      fail-fast: false

      matrix:
        include:
          - service: frontend
            image: koalatech-frontend

          - service: user-service
            image: koalatech-user-service

          - service: student-service
            image: koalatech-student-service

          - service: lecturer-service
            image: koalatech-lecturer-service

          - service: course-service
            image: koalatech-course-service

          - service: enrollment-service
            image: koalatech-enrollment-service

    steps:

      # Node.js 24 compatible version
      - name: Checkout repository
        uses: actions/checkout@v5

      # Authenticate GitHub Actions with Microsoft Azure
      # Node.js 24 compatible Azure Login version
      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Temporary check to verify that GitHub repository
      # variables are available to the workflow
      - name: Check ACR variables
        run: |
          echo "ACR_NAME=${{ secrets.ACR_NAME }}"
          echo "ACR_LOGIN_SERVER=${{ secrets.ACR_LOGIN_SERVER }}"

      # Authenticate with Azure Container Registry
      - name: Login to Azure Container Registry
        run: |
          az acr login --name "${{ secrets.ACR_NAME }}"

      # Build the Docker image with two tags:
      # 1. Git commit SHA
      # 2. latest
      - name: Build Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            -t "${{ secrets.ACR_LOGIN_SERVER }}/${{ matrix.image }}:${{ github.sha }}" \
            -t "${{ secrets.ACR_LOGIN_SERVER }}/${{ matrix.image }}:latest" \
            "./${{ matrix.service }}"

      # Push the commit-specific image
      - name: Push Docker image with commit SHA
        run: |
          docker push \
            "${{ secrets.ACR_LOGIN_SERVER }}/${{ matrix.image }}:${{ github.sha }}"

      # Push the latest image
      - name: Push Docker image with latest tag
        run: |
          docker push \
            "${{ secrets.ACR_LOGIN_SERVER }}/${{ matrix.image }}:latest"
